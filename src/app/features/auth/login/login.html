<div class="flex min-h-screen items-center justify-center bg-gray-100 px-4">
    <form [formGroup]="form" (ngSubmit)="login()"
          class="w-full max-w-sm space-y-5 rounded-xl bg-white p-8 shadow-md">
        <div>
            <label for="username" class="mb-1 block text-sm font-medium text-gray-700">Username</label>
            <input id="username" type="text" formControlName="username" placeholder="Enter your username"
                    class="w-full rounded-lg border border-gray-300 px-3 py-2 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100"/>
        </div>
        <div>
            <label for="password" class="mb-1 block text-sm font-medium text-gray-700">Password</label>
            <input id="password" type="password" formControlName="password" placeholder="Enter your password"
                    class="w-full rounded-lg border border-gray-300 px-3 py-2 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100"/>
        </div>
        <button type="submit" [disabled]="form.invalid" class="w-full rounded-lg bg-blue-600 py-2.5 font-medium text-white transition-colors hover:bg-blue-700 disabled:cursor-not-allowed disabled:opacity-50">
            Login
        </button>
    </form>
</div>
