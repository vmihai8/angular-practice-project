@if (topic(); as topic) {
<app-topic-layout [topic]="topic">
  <div demonstration>
    <div class="space-y-4">
      @defer (on interaction) {
      <app-deferred-child />
      } @placeholder {
      <app-button text="Click to load component"></app-button>
      }
    </div>
  </div>
</app-topic-layout>
}
