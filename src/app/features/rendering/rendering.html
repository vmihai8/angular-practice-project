@if (topic(); as topic) {
<app-topic-layout [topic]="topic">
  <div demonstration>
    <div class="flex justify-between">
      <div>
        <p class="text-2xl font-bold mb-4">Lifecycle</p>
        <ul>
          @for (log of lifecycleLogs(); track $index) {
          <li>{{log}}</li>
          }
        </ul>
      </div>

      <div class="flex flex-col">
        <p class="text-2xl font-bold mb-4">Rendering</p>
        <app-button
          [text]="displayText() ? 'Hide text' : 'Display text'"
          (onClick)="displayText.set(!displayText())"
        ></app-button>

        @if (displayText()) {
        <span>displayed hidden text using &#64;if</span>
        }
        <span [hidden]="!displayText()">displayed hidden text using hidden</span>
        <span [style.display]="displayText() ? 'inline' : 'none'">
          Displayed hidden text using display: none
        </span>
      </div>
    </div>
  </div>
</app-topic-layout>
}
