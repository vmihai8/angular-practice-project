<aside class="w-65 h-full min-h-0 flex flex-col border-r border-gray-300">
  <ul class="flex-1 min-h-0 overflow-y-auto">
    @for (item of menuItems(); track item.route) {
    <li>
      <a
        [routerLink]="item.route"
        (click)="selectItem(item.route)"
        [class.bg-yellow-200]="item.active"
        [class.font-semibold]="item.active"
        class="w-full h-10 shrink-0 px-3 border-b border-gray-300 cursor-pointer text-left text-sm flex items-center"
        [title]="item.label"
      >
        <span class="truncate">{{ item.label }}</span>
      </a>
    </li>
    }
  </ul>

  <div class="shrink-0 border-t border-gray-300">
    <button
      (click)="logout()"
      class="w-full h-10 bg-red-100 hover:bg-red-200 text-red-700 font-semibold cursor-pointer flex items-center justify-center"
    >
      Logout
    </button>
  </div>
</aside>
