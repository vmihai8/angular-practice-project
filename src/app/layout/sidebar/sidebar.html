<aside class="w-50 h-full flex flex-col border-r border-gray-300">
    <ul>
        @for (item of menuItems(); track item.route) {
            <li>
                <button
                        [routerLink]="item.route"
                        (click)="selectItem(item.route)"
                        [class.bg-yellow-200]="item.active"
                        [class.font-semibold]="item.active"
                        class="w-full h-10 border-b border-gray-300 cursor-pointer"
                >
                    {{ item.label }}
                </button>
            </li>
        }
    </ul>

    <div class="border-t border-gray-300 mt-auto">
        <button
                (click)="logout()"
                class="w-full h-10 bg-red-100 hover:bg-red-200 text-red-700 font-semibold cursor-pointer flex items-center justify-center"
        >
            Logout
        </button>
    </div>
</aside>
